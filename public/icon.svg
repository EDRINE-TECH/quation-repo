<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Accent border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Central Badge Symbol -->
  <circle cx="256" cy="256" r="150" fill="url(#bqGrad)" />
  
  <!-- Inner Text / Emblem: BQ -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-2">BQ</text>
  
  <!-- Small indicator dot -->
  <circle cx="360" cy="180" r="16" fill="#10b981" />
</svg>
