    <script>
      // Gracefully suppress harmless HMR WebSocket disconnect messages in preview iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf("reading 'send'") !== -1 || e.message.indexOf("WebSocket") !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).indexOf("reading 'send'") !== -1 || String(e.reason).indexOf("WebSocket") !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
