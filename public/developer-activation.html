<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BQ Developer Activation Code Generator</title>
  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --surface-2: #020617;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --amber-hover: #fbbf24;
      --emerald: #10b981;
      --emerald-hover: #34d399;
      --rose: #fb7185;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #020617;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      min-height: 48px;
      background: var(--surface-2);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--amber);
    }
    input.code-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-align: center;
    }
    .hint {
      font-size: 12px;
      color: var(--amber);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .error {
      display: none;
      background: rgba(136, 19, 55, 0.45);
      border: 1px solid rgba(251, 113, 133, 0.45);
      color: #fecdd3;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, background-color 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--amber);
      color: #020617;
    }
    .btn-primary:hover { background: var(--amber-hover); }
    .output {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: var(--surface-2);
      border: 1px solid #334155;
      border-radius: 16px;
    }
    .output-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .output-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .activation-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--emerald);
      user-select: all;
    }
    .btn-copy {
      width: auto;
      min-height: 44px;
      padding: 0 16px;
      background: var(--emerald);
      color: #020617;
      font-size: 13px;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: var(--emerald-hover); }
    .output-meta {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }
    .footer-actions {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-download {
      width: auto;
      min-height: 40px;
      padding: 0 14px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #334155;
    }
    .btn-download:hover { background: #334155; }
    .footer-note {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="brand">
        <div class="logo">BQ</div>
        <div>
          <h1>Developer Activation Panel</h1>
          <div class="sub">Generate 6-character client activation codes</div>
        </div>
      </div>
    </div>

    <form id="activation-form">
      <div class="field">
        <label for="device-code">1. Device Code (4 characters)</label>
        <input
          id="device-code"
          class="code-input"
          type="text"
          maxlength="4"
          autocomplete="off"
          placeholder="e.g. K7M4"
          required
        />
      </div>

      <div class="field">
        <label for="duration-months">2. Duration (Months — 1 month = 31 days)</label>
        <input
          id="duration-months"
          type="number"
          min="1"
          max="60"
          step="1"
          value="1"
          required
        />
        <div id="duration-summary" class="hint">1 month = 31 days · 10,000 UGX</div>
      </div>

      <div id="error-box" class="error"></div>

      <button type="submit" class="btn btn-primary">
        Generate Activation Code
      </button>
    </form>

    <section id="output-box" class="output">
      <div class="output-label">
        <span>6-Character Activation Code</span>
        <span>Mixed letters &amp; numbers</span>
      </div>
      <div class="output-row">
        <div id="activation-code" class="activation-code">------</div>
        <button id="copy-btn" type="button" class="btn btn-copy">Copy</button>
      </div>
      <div id="output-meta" class="output-meta"></div>
    </section>

    <div class="footer-actions">
      <span class="footer-note">Works 100% offline</span>
      <button id="download-btn" type="button" class="btn btn-download">
        Download Offline Copy (.html)
      </button>
    </div>
  </main>

  <script>
    (function () {
      var ALPHABET = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      var SECRET = 'BQ_UG_TRADE_QUOTE_2026_KAMPALA_9X7M';
      var DAYS_PER_MONTH = 31;
      var PRICE_PER_MONTH_UGX = 10000;
      var lastNonce = -1;

      function fnv1a32(input) {
        var hash = 0x811c9dc5;
        for (var i = 0; i < input.length; i++) {
          hash ^= input.charCodeAt(i);
          hash = Math.imul(hash, 0x01000193);
        }
        hash ^= hash >>> 16;
        hash = Math.imul(hash, 0x85ebca6b);
        hash ^= hash >>> 13;
        hash = Math.imul(hash, 0xc2b2ae35);
        hash ^= hash >>> 16;
        return hash >>> 0;
      }

      function normalizeCode(raw) {
        return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
      }

      function isMixedAlphanumeric(code) {
        return /[2-9]/.test(code) && /[A-HJ-NP-Z]/.test(code);
      }

      function isValidDeviceCode(code) {
        if (code.length !== 4) return false;
        for (var i = 0; i < code.length; i++) {
          if (ALPHABET.indexOf(code[i]) === -1) return false;
        }
        return isMixedAlphanumeric(code);
      }

      function permute30(raw30) {
        var out = 0;
        for (var i = 0; i < 30; i++) {
          if ((raw30 >>> i) & 1) {
            var target = (i * 7 + 5) % 30;
            out |= (1 << target);
          }
        }
        return out >>> 0;
      }

      function encode6Chars(shuffled30) {
        var code = '';
        for (var k = 0; k < 6; k++) {
          var idx = (shuffled30 >>> (k * 5)) & 0x1f;
          code += ALPHABET[idx];
        }
        return code;
      }

      function generateActivationCode(deviceCode, months) {
        var normalizedDevice = normalizeCode(deviceCode);
        if (!isValidDeviceCode(normalizedDevice)) {
          throw new Error('Device code must be 4 mixed characters (letters and numbers, without 0, O, 1, or I).');
        }
        var cleanMonths = Math.floor(Number(months));
        if (!isFinite(cleanMonths) || cleanMonths < 1 || cleanMonths > 60) {
          throw new Error('Duration must be between 1 and 60 months.');
        }

        var startNonce = Math.floor(Math.random() * 64);
        if (startNonce === lastNonce) {
          startNonce = (startNonce + 1) & 0x3f;
        }

        for (var offset = 0; offset < 64; offset++) {
          var nonce = (startNonce + offset) & 0x3f;
          var payload12 = ((nonce & 0x3f) << 6) | (cleanMonths & 0x3f);
          var mac18 = fnv1a32(SECRET + ':MAC:' + normalizedDevice + ':' + payload12) & 0x3ffff;
          var mask12 = fnv1a32(SECRET + ':MASK:' + normalizedDevice + ':' + mac18) & 0xfff;
          var encPayload12 = payload12 ^ mask12;
          var raw30 = ((mac18 & 0x3ffff) << 12) | (encPayload12 & 0xfff);
          var shuffled30 = permute30(raw30);
          var candidate = encode6Chars(shuffled30);
          if (isMixedAlphanumeric(candidate)) {
            lastNonce = nonce;
            return {
              code: candidate,
              deviceCode: normalizedDevice,
              months: cleanMonths,
              days: cleanMonths * DAYS_PER_MONTH
            };
          }
        }

        throw new Error('Failed to generate activation code.');
      }

      var deviceEl = document.getElementById('device-code');
      var monthsEl = document.getElementById('duration-months');
      var summaryEl = document.getElementById('duration-summary');
      var errorEl = document.getElementById('error-box');
      var formEl = document.getElementById('activation-form');
      var outputBox = document.getElementById('output-box');
      var codeEl = document.getElementById('activation-code');
      var metaEl = document.getElementById('output-meta');
      var copyBtn = document.getElementById('copy-btn');
      var downloadBtn = document.getElementById('download-btn');

      function updateDurationSummary() {
        var m = Math.max(0, Math.floor(Number(monthsEl.value) || 0));
        var days = m * DAYS_PER_MONTH;
        var amount = (m * PRICE_PER_MONTH_UGX).toLocaleString();
        summaryEl.textContent =
          m + ' ' + (m === 1 ? 'month' : 'months') + ' = ' + days + ' days · ' + amount + ' UGX';
      }

      deviceEl.addEventListener('input', function () {
        deviceEl.value = normalizeCode(deviceEl.value).slice(0, 4);
        errorEl.style.display = 'none';
      });

      monthsEl.addEventListener('input', function () {
        updateDurationSummary();
        errorEl.style.display = 'none';
      });

      formEl.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.style.display = 'none';
        try {
          var result = generateActivationCode(deviceEl.value, monthsEl.value);
          codeEl.textContent = result.code;
          metaEl.textContent =
            'Device ' + result.deviceCode + ' · ' + result.months +
            (result.months === 1 ? ' month' : ' months') + ' (' + result.days + ' days)';
          outputBox.style.display = 'block';
          copyBtn.textContent = 'Copy';
        } catch (err) {
          outputBox.style.display = 'none';
          errorEl.textContent = err.message || 'Invalid input.';
          errorEl.style.display = 'block';
        }
      });

      copyBtn.addEventListener('click', function () {
        var code = codeEl.textContent || '';
        if (!code || code === '------') return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () {
            copyBtn.textContent = 'Copied!';
            setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2000);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = code;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2000);
        }
      });

      downloadBtn.addEventListener('click', function () {
        var htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'bq-activation-generator.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      updateDurationSummary();
    })();
  </script>
</body>
</html>
